############################# Database #############################
[snowflake.database.ddl_command]
create = "CREATE OR ALTER"
alter  = "CREATE OR ALTER"
drop   = "DROP"

[snowflake.database.ddl_context]
name = "MODELING"
transient = false
data_retention_time_in_days = 1
max_data_extension_time_in_days = 15
default_ddl_collation = "utf8"
log_level = "INFO"
wait_time = 0

[snowflake.database.ddl_context.depends_on]


############################# Schema #############################

[snowflake.schema.ddl_command]
create = "CREATE OR ALTER"
alter  = "CREATE OR ALTER"
drop   = "DROP"

[snowflake.schema.ddl_context]
name = "MODELING.MODELING_SCHEMA"
transient = false
managed_access = false
data_retention_time_in_days = 1
comment = "Example schema"
wait_time = 0

[snowflake.schema.ddl_context.depends_on]


############################# Table #############################

[snowflake.table.ddl_command]
create = "CREATE"
alter  = "ALTER"
drop   = "DROP"

[snowflake.table.ddl_context]
name = "MODELING.MODELING_SCHEMA.FIRST_TABLE"
wait_time = 0

[[snowflake.table.ddl_context.columns]]
name = "first_column"
type = "NUMBER(38,0)"
nullable = "yes"
comment = "Primary key"

[[snowflake.table.ddl_context.columns]]
name = "second_column"
type = "VARCHAR(100)"
nullable = "no"
comment = "Name field"

[snowflake.table.ddl_context.depends_on]
database = [
  "example_database"
]

############################# Alert #############################

[snowflake.alert.ddl_command]
create = "CREATE OR ALTER"
alter  = "CREATE OR ALTER"
drop   = "DROP"

[snowflake.alert.ddl_context]
name = "MODELING.MODELING_SCHEMA.EXAMPLE_ALERT"
warehouse = "COMPUTE_WH"
schedule = "5 MINUTE"
condition = "SELECT 1 FROM MODELING.MODELING_SCHEMA.FIRST_TABLE WHERE 1=0"
action = "INSERT INTO MODELING.MODELING_SCHEMA.FIRST_TABLE VALUES (1, 'alert_fired')"
comment = "Example alert"
wait_time = 0

[snowflake.alert.ddl_context.depends_on]


############################# Dynamic Table #############################

[snowflake.dynamic_table.ddl_command]
create = "CREATE"
alter  = "ALTER"
drop   = "DROP"

[snowflake.dynamic_table.ddl_context]
name = "MODELING.MODELING_SCHEMA.EXAMPLE_DT"
target_lag = "1 hour"
warehouse = "COMPUTE_WH"
query = "SELECT * FROM MODELING.MODELING_SCHEMA.FIRST_TABLE"
comment = "Example dynamic table"
wait_time = 0

[snowflake.dynamic_table.ddl_context.depends_on]


[snowflake.event_table.ddl_command]
create = "CREATE OR ALTER"
alter  = "CREATE OR ALTER"
drop   = "DROP"

[snowflake.event_table.ddl_context]
name = "MODELING.MODELING_SCHEMA.EXAMPLE_EVENTS"
data_retention_time_in_days = 1
change_tracking = "ON"
comment = "Example event table"
wait_time = 0

[snowflake.event_table.ddl_context.depends_on]


[snowflake.grant.ddl_command]
create = "GRANT"
alter  = "GRANT"
drop   = "REVOKE"

[snowflake.grant.ddl_context]
privilege = "SELECT"
on_type = "TABLE"
on_name = "MODELING.MODELING_SCHEMA.FIRST_TABLE"
to_role = "PUBLIC"
with_grant_option = false
wait_time = 0

[snowflake.grant.ddl_context.depends_on]


