[project]
    name = "sqliac-snowflake"
    version = "0.1.0"
    requires-python = ">=3.12"
    dependencies = [
      "sqliac>=0.1.0",
      "snowflake-connector-python",
      "asn1crypto",
      "certifi",
      "charset-normalizer",
      "cryptography",
      "filelock",
      "idna",
      "packaging",
      "platformdirs",
      "pyjwt",
      "pyOpenSSL",
      "pytz",
      "requests",
      "sortedcontainers",
      "tomlkit",
      "typing_extensions",
    ]

    [tool.setuptools.packages.find]
    where = ["src"]

    [project.entry-points."sqliac.adapters"]
    snowflake = "sqliac_snowflake.adapter:SnowflakeAdapter"

    [tool.uv.sources]
    sqliac = { workspace = true }

    [dependency-groups]
    # Keep boto3/botocore out — not needed for SQL/DDL-only usage
    dev = []

    [tool.uv]
    constraint-dependencies = [
      "boto3<0.0.1",
      "botocore<0.0.1",
      "s3transfer<0.0.1",
    ]

    [build-system]
    requires = ["setuptools>=61.0.0", "wheel"]
    build-backend = "setuptools.build_meta"
