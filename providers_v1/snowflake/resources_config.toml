[database.ddl_command]
create = "CREATE OR ALTER"
alter  = "CREATE OR ALTER"
drop   = "DROP"

[database.ddl_context]
name = "example_database"
transient = false
data_retention_time_in_days = 1
max_data_extension_time_in_days = 15
default_ddl_collation = "utf8"
log_level = "INFO"
comment = "Example database"
wait_time = 0

[database.ddl_context.depends_on]
role = ["ACCOUNTADMIN"]


[role.ddl_command]
create = "CREATE OR ALTER"
alter  = "CREATE OR ALTER"
drop   = "DROP"

[role.ddl_context]
name = "example_role"
comment = "Example role"
wait_time = 0

[role.ddl_context.depends_on]
