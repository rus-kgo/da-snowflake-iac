# =============================================================================
# SNOWFLAKE RESOURCES CONFIGURATION
# =============================================================================
# This file defines SQL templates and state queries for Snowflake objects
# following Infrastructure as Code (IaC) principles.
#
# Objects supporting CREATE OR ALTER (as of Nov 2024):
# - DATABASE, SCHEMA, TABLE, VIEW, STAGE, ROLE, DATABASE ROLE
#
# Objects requiring separate CREATE/ALTER/DROP:
# - WAREHOUSE, USER, PROCEDURE, TASK, STREAM, ALERT, GRANT, 
#   STORAGE INTEGRATION, NOTIFICATION INTEGRATION, SECURITY INTEGRATION,
#   DYNAMIC TABLE, EVENT TABLE
# =============================================================================

# =============================================================================
# DATABASE
# =============================================================================
[snowflake.resources.database]
state_query = """
SELECT object_construct(
    'name', database_name,
    'owner', database_owner,
    'transient', type = 'TRANSIENT',
    'data_retention_time_in_days', retention_time,
    'comment', comment,
    'created_on', created
) as object_metadata
FROM information_schema.databases
WHERE database_name = '{{ name }}'
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% set add = add | default({}) %}
{% set change = change | default({}) %}

{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR REPLACE 
{%- if (add.transient | default(false)) or (change.transient | default(false)) %}
 TRANSIENT
{% endif %}
 DATABASE {{ name }}

{% if (add.data_retention_time_in_days | default(None)) 
   or (change.data_retention_time_in_days | default(None)) %}
DATA_RETENTION_TIME_IN_DAYS = {{ add.data_retention_time_in_days | default(change.data_retention_time_in_days) }}
{% endif %}

{% if (add.max_data_extension_time_in_days | default(None)) 
   or (change.max_data_extension_time_in_days | default(None)) %}
MAX_DATA_EXTENSION_TIME_IN_DAYS = {{ add.max_data_extension_time_in_days | default(change.max_data_extension_time_in_days) }}
{% endif %}

{% if (add.default_ddl_collation | default(None)) 
   or (change.default_ddl_collation | default(None)) %}
DEFAULT_DDL_COLLATION = '{{ add.default_ddl_collation | default(change.default_ddl_collation) }}'
{% endif %}

{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP DATABASE {{ name }};
{% endif -%}
"""

[snowflake.resources.database.definition]
name = "example_database"
transient = false
data_retention_time_in_days = 1
max_data_extension_time_in_days = 15
default_ddl_collation = "utf8"
comment = "Example database"
wait_time = 0

[snowflake.resources.database.definition.depends_on]
role = ["ACCOUNTADMIN"]

# =============================================================================
# SCHEMA
# =============================================================================
[snowflake.resources.schema]
state_query = """
SELECT object_construct(
    'name', schema_name,
    'database', catalog_name,
    'owner', schema_owner,
    'transient', is_transient = 'YES',
    'managed_access', is_managed_access = 'YES',
    'data_retention_time_in_days', retention_time,
    'comment', comment,
    'created_on', created
) as object_metadata
FROM information_schema.schemata
WHERE schema_name = '{{ name }}' AND catalog_name = '{{ database }}'
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR ALTER
{% if (add.transient | default(false)) or (change.transient | default(false)) %}
 TRANSIENT
{% endif %}
 SCHEMA {{ database }}.{{ name }}

{% if (add.managed_access | default(false)) or (change.managed_access | default(false)) %}
WITH MANAGED ACCESS
{% endif %}

{% if (add.data_retention_time_in_days | default(None)) 
   or (change.data_retention_time_in_days | default(None)) %}
DATA_RETENTION_TIME_IN_DAYS = {{ add.data_retention_time_in_days | default(change.data_retention_time_in_days) }}
{% endif %}

{% if (add.max_data_extension_time_in_days | default(None)) 
   or (change.max_data_extension_time_in_days | default(None)) %}
MAX_DATA_EXTENSION_TIME_IN_DAYS = {{ add.max_data_extension_time_in_days | default(change.max_data_extension_time_in_days) }}
{% endif %}

{% if (add.default_ddl_collation | default(None)) 
   or (change.default_ddl_collation | default(None)) %}
DEFAULT_DDL_COLLATION = '{{ add.default_ddl_collation | default(change.default_ddl_collation) }}'
{% endif %}

{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP SCHEMA {{ database }}.{{ name }};
{% endif -%}
"""

[snowflake.resources.schema.definition]
name = "example_schema"
database = "example_database"
transient = false
managed_access = false
data_retention_time_in_days = 1
max_data_extension_time_in_days = 14
default_ddl_collation = "utf8"
comment = "Example schema"
wait_time = 0

[snowflake.resources.schema.definition.depends_on]
database = ["example_database"]

# =============================================================================
# TABLE
# =============================================================================
[snowflake.resources.table]
state_query = """
WITH table_cols AS (
    SELECT 
        table_schema,
        table_name,
        ordinal_position,
        column_name,
        data_type,
        is_nullable,
        column_default,
        comment
    FROM information_schema.columns
    WHERE table_name = '{{ name }}' 
    AND table_schema = '{{ schema }}'
    AND table_catalog = '{{ database }}'
)
SELECT object_construct(
    'name', t.table_name,
    'database', t.table_catalog,
    'schema', t.table_schema,
    'owner', t.table_owner,
    'comment', t.comment,
    'columns', array_agg(
        object_construct(
            'name', tc.column_name,
            'type', tc.data_type,
            'nullable', tc.is_nullable = 'YES',
            'default', tc.column_default,
            'comment', tc.comment
        ) ORDER BY tc.ordinal_position
    )
) as object_metadata
FROM information_schema.tables t
LEFT JOIN table_cols tc ON t.table_schema = tc.table_schema AND t.table_name = tc.table_name
WHERE t.table_name = '{{ name }}' 
AND t.table_schema = '{{ schema }}'
AND t.table_catalog = '{{ database }}'
GROUP BY t.table_catalog, t.table_schema, t.table_name, t.table_owner, t.comment
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR ALTER TABLE {{ database }}.{{ schema }}.{{ name }} (
{% if add.columns %}
{% for column in add.columns %}
    {{ column.name }} {{ column.type }}
    {%- if not column.nullable %} NOT NULL{% endif %}
    {%- if column.default is not none %} DEFAULT {{ column.default }}{% endif %}
    {%- if column.comment %} COMMENT '{{ column.comment }}'{% endif %}
    {%- if not loop.last %},{% endif %}
{% endfor %}
{% elif change.columns %}
{% for column in change.columns %}
    {{ column.name }} {{ column.type }}
    {%- if not column.nullable %} NOT NULL{% endif %}
    {%- if column.default is not none %} DEFAULT {{ column.default }}{% endif %}
    {%- if column.comment %} COMMENT '{{ column.comment }}'{% endif %}
    {%- if not loop.last %},{% endif %}
{% endfor %}
{% endif %}
)
{% if (add.cluster_by | default(None)) or (change.cluster_by | default(None)) %}
CLUSTER BY ({{ (add.cluster_by | default(change.cluster_by)) | join(', ') }})
{% endif %}
{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP TABLE {{ database }}.{{ schema }}.{{ name }};
{% endif -%}
"""

[snowflake.resources.table.definition]
name = "example_table"
database = "example_database"
schema = "example_schema"
comment = "Example table"
wait_time = 0

[[snowflake.resources.table.definition.columns]]
name = "id"
type = "NUMBER(38,0)"
nullable = false
comment = "Primary key"

[[snowflake.resources.table.definition.columns]]
name = "name"
type = "VARCHAR(100)"
nullable = true
comment = "Name field"

[snowflake.resources.table.definition.depends_on]
schema = ["example_schema"]

# =============================================================================
# VIEW
# =============================================================================
[snowflake.resources.view]
state_query = """
SELECT object_construct(
    'name', table_name,
    'database', table_catalog,
    'schema', table_schema,
    'owner', table_owner,
    'secure', is_secure = 'YES',
    'comment', comment,
    'as_', view_definition
) as object_metadata
FROM information_schema.views
WHERE table_name = '{{ name }}' 
AND table_schema = '{{ schema }}'
AND table_catalog = '{{ database }}'
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR ALTER
{% if (add.secure | default(false)) or (change.secure | default(false)) %}
 SECURE
{% endif %}
 VIEW {{ database }}.{{ schema }}.{{ name }}

{% if (add.change_tracking | default(false)) or (change.change_tracking | default(false)) %}
CHANGE_TRACKING = TRUE
{% endif %}

{% if (add.copy_grants | default(false)) or (change.copy_grants | default(false)) %}
COPY GRANTS
{% endif %}

{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %}

AS {{ add.as_ | default(change.as_) }};

{% elif iac_action.upper() == 'DROP' %}
DROP VIEW {{ database }}.{{ schema }}.{{ name }};
{% endif -%}
"""

[snowflake.resources.view.definition]
name = "example_view"
database = "example_database"
schema = "example_schema"
secure = false
change_tracking = false
copy_grants = false
as_ = "SELECT * FROM example_database.example_schema.example_table"
comment = "Example view"
wait_time = 0

[snowflake.resources.view.definition.depends_on]
table = ["example_table"]

# =============================================================================
# ROLE (Account Role)
# =============================================================================
[snowflake.resources.role]
state_query = """
SELECT object_construct(
    'name', name,
    'owner', owner,
    'comment', comment,
    'created_on', created_on
) as object_metadata
FROM snowflake.account_usage.roles
WHERE name = '{{ name }}'
AND deleted_on IS NULL
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR ALTER ROLE {{ name }}
{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP ROLE {{ name }};
{% endif -%}
"""

[snowflake.resources.role.definition]
name = "example_role"
comment = "Example role"
wait_time = 0

[snowflake.resources.role.definition.depends_on]

# =============================================================================
# DATABASE ROLE
# =============================================================================
[snowflake.resources.database_role]
state_query = """
SHOW DATABASE ROLES LIKE '{{ name }}' IN DATABASE {{ database }};

SELECT object_construct(
    'name', "name",
    'database', "database_name",
    'owner', "owner",
    'comment', "comment",
    'created_on', "created_on"
) as object_metadata
FROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))
WHERE "name" = '{{ name }}'
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR ALTER DATABASE ROLE {{ database }}.{{ name }}
{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP DATABASE ROLE {{ database }}.{{ name }};
{% endif -%}
"""

[snowflake.resources.database_role.definition]
name = "example_db_role"
database = "example_database"
comment = "Example database role"
wait_time = 0

[snowflake.resources.database_role.definition.depends_on]
database = ["example_database"]

# =============================================================================
# USER
# =============================================================================
[snowflake.resources.user]
state_query = """
SELECT object_construct(
    'name', name,
    'login_name', login_name,
    'display_name', display_name,
    'email', email,
    'disabled', disabled,
    'default_warehouse', default_warehouse,
    'default_namespace', default_namespace,
    'default_role', default_role,
    'comment', comment,
    'created_on', created_on
) as object_metadata
FROM snowflake.account_usage.users
WHERE name = '{{ name }}'
AND deleted_on IS NULL
LIMIT 1
"""

iac_action.create = "CREATE"
iac_action.alter = "ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE' %}
CREATE USER {{ name }}
{% if add.password %}PASSWORD = '{{ add.password }}' {% endif %}
{% if add.login_name %}LOGIN_NAME = '{{ add.login_name }}' {% endif %}
{% if add.display_name %}DISPLAY_NAME = '{{ add.display_name }}' {% endif %}
{% if add.email %}EMAIL = '{{ add.email }}' {% endif %}
{% if add.disabled is not none %}DISABLED = {{ add.disabled | string | upper }} {% endif %}
{% if add.default_warehouse %}DEFAULT_WAREHOUSE = {{ add.default_warehouse }} {% endif %}
{% if add.default_namespace %}DEFAULT_NAMESPACE = {{ add.default_namespace }} {% endif %}
{% if add.default_role %}DEFAULT_ROLE = {{ add.default_role }} {% endif %}
{% if add.must_change_password is not none %}MUST_CHANGE_PASSWORD = {{ add.must_change_password | string | upper }} {% endif %}
{% if add.rsa_public_key %}RSA_PUBLIC_KEY = '{{ add.rsa_public_key }}' {% endif %}
{% if add.rsa_public_key_2 %}RSA_PUBLIC_KEY_2 = '{{ add.rsa_public_key_2 }}' {% endif %}
{% if add.comment %}COMMENT = '{{ add.comment }}'{% endif %};

{% elif iac_action.upper() == 'ALTER' %}
{% if change.password %}
ALTER USER {{ name }} SET PASSWORD = '{{ change.password }}';
{% endif %}
{% if change.display_name %}
ALTER USER {{ name }} SET DISPLAY_NAME = '{{ change.display_name }}';
{% endif %}
{% if change.email %}
ALTER USER {{ name }} SET EMAIL = '{{ change.email }}';
{% endif %}
{% if change.disabled is not none %}
ALTER USER {{ name }} SET DISABLED = {{ change.disabled | string | upper }};
{% endif %}
{% if change.default_warehouse %}
ALTER USER {{ name }} SET DEFAULT_WAREHOUSE = {{ change.default_warehouse }};
{% endif %}
{% if change.default_namespace %}
ALTER USER {{ name }} SET DEFAULT_NAMESPACE = {{ change.default_namespace }};
{% endif %}
{% if change.default_role %}
ALTER USER {{ name }} SET DEFAULT_ROLE = {{ change.default_role }};
{% endif %}
{% if change.must_change_password is not none %}
ALTER USER {{ name }} SET MUST_CHANGE_PASSWORD = {{ change.must_change_password | string | upper }};
{% endif %}
{% if change.rsa_public_key %}
ALTER USER {{ name }} SET RSA_PUBLIC_KEY = '{{ change.rsa_public_key }}';
{% endif %}
{% if change.rsa_public_key_2 %}
ALTER USER {{ name }} SET RSA_PUBLIC_KEY_2 = '{{ change.rsa_public_key_2 }}';
{% endif %}
{% if change.comment %}
ALTER USER {{ name }} SET COMMENT = '{{ change.comment }}';
{% endif %}

{% elif iac_action.upper() == 'DROP' %}
DROP USER {{ name }};

{% endif -%}
"""

[snowflake.resources.user.definition]
name = "example_user"
password = "SecurePassword123!"
login_name = "example_login"
display_name = "Example User"
email = "example@example.com"
disabled = false
default_warehouse = "COMPUTE_WH"
default_namespace = "example_database.example_schema"
default_role = "PUBLIC"
must_change_password = false
comment = "Example user"
wait_time = 0

[snowflake.resources.user.definition.depends_on]
role = ["PUBLIC"]
warehouse = ["COMPUTE_WH"]

# =============================================================================
# WAREHOUSE
# =============================================================================
[snowflake.resources.warehouse]
state_query = """
SELECT object_construct(
    'name', name,
    'warehouse_type', type,
    'warehouse_size', size,
    'max_cluster_count', max_cluster_count,
    'min_cluster_count', min_cluster_count,
    'scaling_policy', scaling_policy,
    'auto_suspend', auto_suspend,
    'auto_resume', auto_resume,
    'enable_query_acceleration', enable_query_acceleration = 'true',
    'query_acceleration_max_scale_factor', query_acceleration_max_scale_factor,
    'comment', comment,
    'owner', owner,
    'created_on', created_on
) as object_metadata
FROM snowflake.account_usage.warehouses
WHERE name = '{{ name }}'
AND deleted IS NULL
LIMIT 1
"""

iac_action.create = "CREATE"
iac_action.alter = "ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE' %}
CREATE WAREHOUSE {{ name }}
{% if add.warehouse_type %}WAREHOUSE_TYPE = {{ add.warehouse_type }} {% endif %}
{% if add.warehouse_size %}WAREHOUSE_SIZE = {{ add.warehouse_size }} {% endif %}
{% if add.max_cluster_count %}MAX_CLUSTER_COUNT = {{ add.max_cluster_count }} {% endif %}
{% if add.min_cluster_count %}MIN_CLUSTER_COUNT = {{ add.min_cluster_count }} {% endif %}
{% if add.scaling_policy %}SCALING_POLICY = {{ add.scaling_policy }} {% endif %}
{% if add.auto_suspend %}AUTO_SUSPEND = {{ add.auto_suspend }} {% endif %}
{% if add.auto_resume is not none %}AUTO_RESUME = {{ add.auto_resume | string | upper }} {% endif %}
{% if add.initially_suspended is not none %}INITIALLY_SUSPENDED = {{ add.initially_suspended | string | upper }} {% endif %}
{% if add.enable_query_acceleration is not none %}ENABLE_QUERY_ACCELERATION = {{ add.enable_query_acceleration | string | upper }} {% endif %}
{% if add.query_acceleration_max_scale_factor %}QUERY_ACCELERATION_MAX_SCALE_FACTOR = {{ add.query_acceleration_max_scale_factor }} {% endif %}
{% if add.comment %}COMMENT = '{{ add.comment }}'{% endif %};

{% elif iac_action.upper() == 'ALTER' %}
ALTER WAREHOUSE {{ name }} SET
{% if change.warehouse_size %}WAREHOUSE_SIZE = {{ change.warehouse_size }} {% endif %}
{% if change.max_cluster_count %}MAX_CLUSTER_COUNT = {{ change.max_cluster_count }} {% endif %}
{% if change.min_cluster_count %}MIN_CLUSTER_COUNT = {{ change.min_cluster_count }} {% endif %}
{% if change.scaling_policy %}SCALING_POLICY = {{ change.scaling_policy }} {% endif %}
{% if change.auto_suspend %}AUTO_SUSPEND = {{ change.auto_suspend }} {% endif %}
{% if change.auto_resume is not none %}AUTO_RESUME = {{ change.auto_resume | string | upper }} {% endif %}
{% if change.enable_query_acceleration is not none %}ENABLE_QUERY_ACCELERATION = {{ change.enable_query_acceleration | string | upper }} {% endif %}
{% if change.query_acceleration_max_scale_factor %}QUERY_ACCELERATION_MAX_SCALE_FACTOR = {{ change.query_acceleration_max_scale_factor }} {% endif %}
{% if change.comment %}COMMENT = '{{ change.comment }}'{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP WAREHOUSE {{ name }};

{% endif -%}
"""

[snowflake.resources.warehouse.definition]
name = "example_warehouse"
warehouse_type = "STANDARD"
warehouse_size = "XSMALL"
max_cluster_count = 1
min_cluster_count = 1
scaling_policy = "STANDARD"
auto_suspend = 600
auto_resume = true
initially_suspended = false
enable_query_acceleration = false
query_acceleration_max_scale_factor = 8
comment = "Example warehouse"
wait_time = 0

[snowflake.resources.warehouse.definition.depends_on]

# =============================================================================
# STAGE
# =============================================================================
[snowflake.resources.stage]
state_query = """
SHOW STAGES LIKE '{{ name }}' IN SCHEMA {{ database }}.{{ schema }};

SELECT object_construct(
    'name', "name",
    'database', "database_name",
    'schema', "schema_name",
    'url', "url",
    'comment', "comment",
    'owner', "owner",
    'created_on', "created_on"
) as object_metadata
FROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))
WHERE "name" = '{{ name }}'
LIMIT 1
"""

iac_action.create = "CREATE OR ALTER"
iac_action.alter = "CREATE OR ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE OR ALTER' %}
CREATE OR ALTER STAGE {{ database }}.{{ schema }}.{{ name }}

{% if (add.url | default(None)) or (change.url | default(None)) %}
URL = '{{ add.url | default(change.url) }}'
{% endif %}

{% if (add.storage_integration | default(None)) or (change.storage_integration | default(None)) %}
STORAGE_INTEGRATION = {{ add.storage_integration | default(change.storage_integration) }}
{% endif %}

{% if (add.file_format | default(None)) or (change.file_format | default(None)) %}
FILE_FORMAT = {{ add.file_format | default(change.file_format) }}
{% endif %}

{% if (add.comment | default(None)) or (change.comment | default(None)) %}
COMMENT = '{{ add.comment | default(change.comment) }}'
{% endif %};

{% elif iac_action.upper() == 'DROP' %}
DROP STAGE {{ database }}.{{ schema }}.{{ name }};
{% endif -%}
"""

[snowflake.resources.stage.definition]
name = "example_stage"
database = "example_database"
schema = "example_schema"
url = "s3://my-bucket/path/"
storage_integration = "my_storage_integration"
file_format = "(TYPE = CSV)"
comment = "Example stage"
wait_time = 0

[snowflake.resources.stage.definition.depends_on]
schema = ["example_schema"]
storage_integration = ["my_storage_integration"]

# =============================================================================
# PROCEDURE
# =============================================================================
[snowflake.resources.procedure]
state_query = """
SHOW PROCEDURES LIKE '{{ name }}' IN SCHEMA {{ database }}.{{ schema }};

SELECT object_construct(
    'name', "name",
    'database', "catalog_name",
    'schema', "schema_name",
    'owner', "owner",
    'language', "language",
    'comment', "description"
) as object_metadata
FROM TABLE(RESULT_SCAN(LAST_QUERY_ID()))
WHERE "name" = '{{ name }}'
LIMIT 1
"""

iac_action.create = "CREATE"
iac_action.alter = "ALTER"
iac_action.drop = "DROP"

template = """
{% if iac_action.upper() == 'CREATE' %}
CREATE OR REPLACE PROCEDURE {{ database }}.{{ schema }}.{{ name }}(
{%- if add.arguments %}
{% for arg in add.arguments %}
    {{ arg.name }} {{ arg.type }}{% if not loop.last %}, {% endif %}
{% endfor %}
{%- endif -%}
)
RETURNS {{ add.returns }}
LANGUAGE {{ add.language | upper }}
{% if add.runtime_version %}RUNTIME_VERSION = '{{ add.runtime_version }}' {% endif %}
{% if add.packages %}PACKAGES = (
{%- for pkg in add.packages -%}
'{{ pkg }}'{% if not loop.last %}, {% endif %}
{%- endfor -%}
) {% endif %}
{% if add.imports %}IMPORTS = (
{%- for imp in add.imports -%}
'{{ imp }}'{% if not loop.last %}, {% endif %}
{%- endfor -%}
) {% endif %}
{% if add.handler %}HANDLER = '{{ add.handler }}' {% endif %}
{% if add.execute_as %}EXECUTE AS {{ add.execute_as | upper }} {% endif %}
{% if add.comment %}COMMENT = '{{ add.comment }}' {% endif %}
AS
$$
{{ add.body }}
$$;

{% elif iac_action.upper() == 'ALTER' %}
{% if change.comment %}
ALTER PROCEDURE {{ database }}.{{ schema }}.{{ name }}(
{%- if change.arguments %}
{%- for arg in change.arguments -%}
{{ arg.type }}{% if not loop.last %}, {% endif %}
{%- endfor -%}
{%- endif -%}
) SET COMMENT = '{{ change.comment }}';
{% endif %}

{% elif iac_action.upper() == 'DROP' %}
DROP PROCEDURE {{ database }}.{{ schema }}.{{ name }}(
{%- if remove.arguments %}
